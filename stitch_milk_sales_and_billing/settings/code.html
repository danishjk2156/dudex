<div>

<input class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body" type="text" value="Solan Nagar"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block font-label text-sm font-medium text-on-surface-variant mb-1">City</label>
<input class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body" type="text" value="Chennai - 600109"/>
</div>
<div>

<input class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-mono" type="tel" value="9840865510"/>
</div>
</div>
<div>

<input class="w-full bg-surface-container-highest border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-mono uppercase" placeholder="Enter GSTIN (optional)" type="text"/>
</div>
<button class="w-full mt-6 bg-primary text-on-primary font-headline font-bold py-3.5 rounded-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-2 shadow-md" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>

                </button>
</form>
</section>
