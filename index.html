<!DOCTYPE html>
<html lang="en" class="min-h-screen min-h-[100dvh] w-full bg-[#EEF2F0] dark:bg-[#0A1110]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><path d='M7 18h10v-2H7v2zm0-4h10v-2H7v2zm0-4h10V8H7v2zm-4 8v-14h18v14H3z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A1110" />
    <meta name="description" content="Universal Business Sales, Billing, WhatsApp Sharing & Bluetooth Thermal Printing Web App" />
    <title>Business Billing & Thermal POS</title>
    
    <!-- Early theme initializer to prevent visual flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pos_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) || !saved;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Public+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="font-sans antialiased selection:bg-amber-500 selection:text-black min-h-screen min-h-[100dvh] w-full bg-[#EEF2F0] dark:bg-[#0A1110] overflow-x-hidden transition-colors">
    <div id="root" class="min-h-screen min-h-[100dvh] w-full flex flex-col bg-[#EEF2F0] dark:bg-[#0A1110]"></div>
    <!-- GSAP Animation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
